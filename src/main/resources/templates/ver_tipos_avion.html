<!DOCTYPE html>
<html>

<head>
    <meta charset="UTP-8">
    <title> Tipos de Aviones </title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <div class="container">
        <h1>
            Buscador de Tipos de Aviones
        </h1>
        <form action="#" th:action="@{/ver_tipos_avion}" method="post">
            Tipo de Avión (ID): <input type="text" , name="tipo" /> <br>
        
            <input type="submit" , value="Buscar" /> <br>

        </form><br>
        <table>
            <tr>
                <th>Código Tipo</th>
                <th>Identificador</th>
                <th>Descripción</th>
               
            </tr>
            <tr th:each="airplane,airplaneStat : ${airplanes}">
                <td><span th:text="${airplane.airplaneId}"></span><a href="/mostrar_aviones">Texto del enlace</a></td>
                <td><span th:text="${airplane.identifier}"></span></td>
                <td><span th:text="${airplane.description}"></span></td>
               
            </tr>
        </table>
        <a href="/mostrar_aviones">Ir a lista de aviones</a>
    </div>
</body>

</html>
